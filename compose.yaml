name: training-registration
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: training
      POSTGRES_USER: training
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training -d training"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: training
      PGDATABASE: training
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - 'while true; do pg_dump --format=custom --file="/backups/training-$$(date -u +%Y%m%dT%H%M%SZ).dump" || exit 1; sleep 86400; done'
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://training:${POSTGRES_PASSWORD}@db:5432/training
      PORT: 3000
      TRUST_PROXY: 1
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
