<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6344d5">
  <meta name="description" content="ค้นหาหลักสูตรที่ใช่ พัฒนาทักษะใหม่ และจัดการการสมัครอบรมของคุณในที่เดียว">
  <title>เรียนรู้ — พื้นที่ของการเติบโต</title>

<body>
  <a class="skip-link" href="#main">ข้ามไปเนื้อหาหลัก</a>
  <header id="header" class="site-header"></header>
  <main id="main" tabindex="-1"><div class="page-loading" role="status">กำลังเตรียมพื้นที่การเรียนรู้…</div></main>
  <footer id="footer" class="site-footer"></footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
